<label>Nom*</label>

<div class="row">
<div>

<input name="email" type="email" required maxlength="180" autocomplete="email">
</div>
<div>
<label>Téléphone</label>
<input name="phone" type="tel" maxlength="40" autocomplete="tel">
</div>
</div>


<label>Message*</label>
<textarea name="message" rows="6" required maxlength="5000"></textarea>


<label>Photos (upload externe)</label>
<button type="button" id="btnUpload">Choisir des fichiers</button>
<div class="hint">Les fichiers sont stockés chez Bytescale (jusqu'à 500 Mo par fichier selon plan). Les liens seront joints à votre message.</div>
<div id="uploads"></div>


<!-- Les URLs des fichiers (envoyées à Netlify Forms) -->
<input type="hidden" name="file_urls" id="file_urls">


<button type="submit">Envoyer</button>
</form>
</div>


<script>
// ====== CONFIG BYTESCALE ======
const apiKey = "public_kW2K8bQDj6TDrDE2FvM57zrdxNh2"; // ta clé publique


// Options du widget
const widgetOptions = {
apiKey,
maxFileCount: 10,
maxFileSizeBytes: 500 * 1024 * 1024, // 500 Mo (ajuste selon ton plan Bytescale)
multi: true,
mimeTypes: ["image/*"],
path: {
folderPath: "/studio3d/uploads/${new Date().getFullYear()}/${String(new Date().getMonth()+1).padStart(2,'0')}/"
}
};


const btn = document.getElementById('btnUpload');
const uploadsDiv = document.getElementById('uploads');
const hidden = document.getElementById('file_urls');
let fileURLs = [];


btn.addEventListener('click', async () => {
try {
const result = await BytescaleUploadWidget.open(widgetOptions);
if (result && result.files) {
result.files.forEach(f => {
fileURLs.push(f.fileUrl);
const link = document.createElement('a');
link.href = f.fileUrl;
link.target = "_blank";
link.rel = "noopener";
link.textContent = f.originalFileName || 'fichier';
uploadsDiv.appendChild(link);
});
hidden.value = fileURLs.join('\n');
}
} catch (e) {
alert('Erreur upload : ' + e);
}
});
</script>
</body>
</html>
