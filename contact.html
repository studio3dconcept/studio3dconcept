<!DOCTYPE html>
<main class="container">
<h1>Contact / Devis</h1>


<form name="contact" action="success.html" method="POST" data-netlify="true" netlify-honeypot="website" id="contactForm" class="card">
<input type="hidden" name="form-name" value="contact">
<p class="hp"><label>Ne pas remplir <input name="website"></label></p>


<label>Nom*</label>
<input name="name" required maxlength="120" autocomplete="name">


<div class="row">
<div>
<label>Email*</label>
<input name="email" type="email" required maxlength="180" autocomplete="email">
</div>
<div>
<label>Téléphone</label>
<input name="phone" type="tel" maxlength="40" autocomplete="tel">
</div>
</div>


<label>Message*</label>
<textarea name="message" rows="6" required maxlength="5000"></textarea>


<label>Photos (upload externe)</label>
<button type="button" id="btnUpload" class="btn">Choisir des fichiers</button>
<p class="hint">Les fichiers sont stockés chez Bytescale. Les liens seront joints à votre message.</p>
<div id="uploads" class="chips"></div>


<input type="hidden" name="file_urls" id="file_urls">


<button type="submit" class="btn">Envoyer</button>
</form>
</main>


<footer class="container foot">© Studio 3D Concept</footer>


<script>
const apiKey = "public_kW2K8bQDj6TDrDE2FvM57zrdxNh2"; // ta clé publique
const widgetOptions = {
apiKey,
maxFileCount: 10,
maxFileSizeBytes: 500 * 1024 * 1024,
multi: true,
mimeTypes: ["image/*"],
path: { folderPath: "/studio3d/uploads/${new Date().getFullYear()}/${String(new Date().getMonth()+1).padStart(2,'0')}/" }
};


const btn = document.getElementById('btnUpload');
const uploadsDiv = document.getElementById('uploads');
const hidden = document.getElementById('file_urls');
let fileURLs = [];


btn.addEventListener('click', async () => {
try {
const result = await BytescaleUploadWidget.open(widgetOptions);
if (result && result.files) {
result.files.forEach(f => {
fileURLs.push(f.fileUrl);
const a = document.createElement('a');
a.href = f.fileUrl; a.target = '_blank'; a.rel = 'noopener';
a.textContent = f.originalFileName || 'fichier';
a.className = 'chip';
uploadsDiv.appendChild(a);
});
hidden.value = fileURLs.join('\n');
}
} catch (e) { alert('Erreur upload : ' + e); }
});
</script>
</body>
</html>
